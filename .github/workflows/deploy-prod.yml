name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# Never cancel a prod deploy in flight. Queue the next one behind it so
# Functions -> Firestore -> Hosting ordering is preserved across pushes.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci-gate:
    name: CI gate (wait for ci.yml on this SHA)
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow to succeed on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha
            const maxAttempts = 60   // 60 * 30 s = up to 30 minutes
            const sleep = (ms) => new Promise(r => setTimeout(r, ms))
            core.info(`Waiting for CI workflow to complete on ${sha}…`)
            for (let i = 0; i < maxAttempts; i++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                head_sha: sha,
                per_page: 100,
              })
              const ciRuns = data.workflow_runs
                .filter(r => r.name === 'CI')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              if (ciRuns.length === 0) {
                core.info(`(${i + 1}/${maxAttempts}) No CI run yet for ${sha}`)
              } else {
                const latest = ciRuns[0]
                core.info(`(${i + 1}/${maxAttempts}) CI run ${latest.id} status=${latest.status} conclusion=${latest.conclusion ?? '—'}`)
                if (latest.status === 'completed') {
                  if (latest.conclusion === 'success') {
                    core.info('CI green — proceeding with prod deploy.')
                    return
                  }
                  core.setFailed(`CI for ${sha} concluded ${latest.conclusion}; aborting prod deploy.`)
                  return
                }
              }
              await sleep(30_000)
            }
            core.setFailed('Timed out after 30 min waiting for CI to complete; aborting prod deploy.')

  deploy-functions:
    name: Deploy Cloud Functions
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install + build functions
        run: |
          cd functions
          npm ci
          npm run build

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/firebase"
          # The secret is stored base64-encoded; decode to JSON on disk.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$RUNNER_TEMP/firebase/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase/sa.json" >> "$GITHUB_ENV"

      - name: Deploy Functions
        run: |
          cd functions
          npx firebase deploy \
            --only functions \
            --project worldcup-live-scores-2026 \
            --non-interactive \
            --force

  deploy-firestore:
    name: Deploy Firestore rules + indexes
    needs: deploy-functions
    runs-on: ubuntu-latest
    environment: production
    # Hard requirement: rules/indexes must apply cleanly before hosting goes
    # live. Do not swallow failures.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root deps (for firebase CLI cache reuse)
        run: npm ci

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/firebase"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$RUNNER_TEMP/firebase/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase/sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules + indexes
        run: |
          npx firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project worldcup-live-scores-2026 \
            --non-interactive \
            --force

  deploy-hosting:
    name: Deploy Hosting (live channel)
    needs: deploy-firestore
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install + build web
        env:
          VITE_FIREBASE_API_KEY:     ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:  worldcup-live-scores-2026
          VITE_FIREBASE_APP_ID:      ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_KEY:        ${{ secrets.VITE_RECAPTCHA_KEY }}
        run: |
          npm ci
          npm run build

      # FirebaseExtended/action-hosting-deploy needs the SA as raw JSON;
      # the stored secret is base64. Decode + mask + expose as step output.
      - name: Decode Firebase service account
        id: sa
        env:
          SA_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${SA_B64:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty."
            exit 1
          fi
          decoded=$(printf '%s' "$SA_B64" | base64 -d)
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$decoded"
          {
            echo 'json<<SA_EOF'
            printf '%s\n' "$decoded"
            echo 'SA_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ steps.sa.outputs.json }}
          projectId: worldcup-live-scores-2026
          channelId: live
