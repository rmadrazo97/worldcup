name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Vite client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  functions:
    name: Cloud Functions (TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Upload functions build artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-lib
          path: functions/lib
          retention-days: 7

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  plan-docs:
    name: Plan-docs gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
      - name: Require docs/plan update for API surface changes
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          echo "Diffing $base_sha...$head_sha"
          changed=$(git diff --name-only "$base_sha" "$head_sha")
          echo "Changed files:"
          echo "$changed"
          touches_api=$(echo "$changed" | grep -E '^(src/api/|functions/src/)' || true)
          touches_plan=$(echo "$changed" | grep -E '^docs/plan/' || true)
          if [ -n "$touches_api" ] && [ -z "$touches_plan" ]; then
            echo "::error::Changes under src/api/** or functions/src/** require a matching update under docs/plan/**. Update the relevant plan doc and push again."
            echo "API-surface files changed without a plan-docs update:"
            echo "$touches_api"
            exit 1
          fi
          echo "plan-docs gate OK"

  app-check-gate:
    name: App Check enforcement gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Every callable handler must enforce App Check
        run: |
          set -euo pipefail
          handler_dir="functions/src/handlers"
          if [ ! -d "$handler_dir" ]; then
            echo "::error::Expected handler directory $handler_dir not found."
            exit 1
          fi

          # Fail loudly if any handler defines onCall without an App Check
          # enforcement marker (either enforceAppCheck: true literally, or our
          # shared APP_CHECK_OPTS preset).
          failed=0
          for f in $(find "$handler_dir" -type f -name '*.ts'); do
            oncall_count=$(grep -cE '\bonCall\s*\(' "$f" || true)
            enforce_count=$(grep -cE '(enforceAppCheck:\s*true|APP_CHECK_OPTS)' "$f" || true)
            if [ "$oncall_count" -gt 0 ] && [ "$enforce_count" -lt "$oncall_count" ]; then
              echo "::error file=$f::Found $oncall_count onCall declaration(s) but only $enforce_count App Check enforcement marker(s). Every onCall must set enforceAppCheck: true (or use APP_CHECK_OPTS)."
              failed=1
            fi
          done

          # Global sanity check: at least one match exists somewhere under handlers.
          if ! grep -RIlE '(enforceAppCheck:\s*true|APP_CHECK_OPTS)' "$handler_dir" >/dev/null; then
            echo "::error::No enforceAppCheck markers found anywhere under $handler_dir."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "App Check gate OK"
