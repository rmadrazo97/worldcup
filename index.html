<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#19227F" />
    <title>World Cup 2026 — Live Scores</title>
    <link rel="preconnect" href="https://flagcdn.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Google Consent Mode v2 defaults. Set BEFORE any analytics or ad code
      runs so signals are propagated correctly to AdSense / GA4. Defaults are
      "denied"; the in-app consent banner updates them when the user accepts.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = window.gtag || gtag;
      gtag('consent', 'default', {
        ad_storage:         'denied',
        ad_user_data:       'denied',
        ad_personalization: 'denied',
        analytics_storage:  'denied',
        wait_for_update:    500
      });
    </script>
    <!--
      Google AdSense site verification + ad code loader. The publisher ID
      is public (appears in every rendered ad unit). Loading the tag here
      (rather than only from JS) ensures AdSense's site-review crawler
      finds it even before any React code runs.
    -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3627469464584624"
         crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
