name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a prod deploy in flight. Queue the next one behind it so
# Functions -> Firestore -> Hosting ordering is preserved across pushes.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: |
          echo "Relying on branch protection to ensure ci.yml is green for ${{ github.sha }}."
          echo "If branch protection is ever relaxed, replace this job with an"
          echo "actions/github-script call that polls commit status before proceeding."

  deploy-functions:
    name: Deploy Cloud Functions
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install + build functions
        run: |
          cd functions
          npm ci
          npm run build

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/firebase"
          # The secret is stored base64-encoded; decode to JSON on disk.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$RUNNER_TEMP/firebase/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase/sa.json" >> "$GITHUB_ENV"

      - name: Deploy Functions
        run: |
          cd functions
          npx firebase deploy \
            --only functions \
            --project worldcup-live-scores-2026 \
            --non-interactive \
            --force

  deploy-firestore:
    name: Deploy Firestore rules + indexes
    needs: deploy-functions
    runs-on: ubuntu-latest
    environment: production
    # Hard requirement: rules/indexes must apply cleanly before hosting goes
    # live. Do not swallow failures.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root deps (for firebase CLI cache reuse)
        run: npm ci

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/firebase"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$RUNNER_TEMP/firebase/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase/sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules + indexes
        run: |
          npx firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project worldcup-live-scores-2026 \
            --non-interactive \
            --force

  deploy-hosting:
    name: Deploy Hosting (live channel)
    needs: deploy-firestore
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install + build web
        env:
          VITE_FIREBASE_API_KEY:     ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:  worldcup-live-scores-2026
          VITE_FIREBASE_APP_ID:      ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_KEY:        ${{ secrets.VITE_RECAPTCHA_KEY }}
        run: |
          npm ci
          npm run build

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: worldcup-live-scores-2026
          channelId: live
