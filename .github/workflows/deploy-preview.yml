name: Deploy preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

# One preview deploy per PR. Cancel an in-flight deploy if a new commit lands.
concurrency:
  group: deploy-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web + functions
    runs-on: ubuntu-latest
    outputs:
      web-artifact: web-dist-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install + build web
        run: |
          npm ci
          npm run build

      - name: Install + build functions
        run: |
          cd functions
          npm ci
          npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.event.pull_request.number }}
          path: dist
          retention-days: 7

      - name: Upload functions lib
        uses: actions/upload-artifact@v4
        with:
          name: functions-lib-${{ github.event.pull_request.number }}
          path: functions/lib
          retention-days: 7

  deploy-preview:
    name: Deploy Hosting preview channel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.event.pull_request.number }}
          path: dist

      # The FIREBASE_SERVICE_ACCOUNT secret is stored base64-encoded (so it
      # fits cleanly in a single GitHub secret line). FirebaseExtended's
      # action expects the raw JSON, so decode here and pass via a step
      # output. Every line of the decoded JSON is masked so it can't leak
      # into logs if a later step echoes the output by accident.
      - name: Decode Firebase service account
        id: sa
        env:
          SA_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${SA_B64:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty."
            exit 1
          fi
          decoded=$(printf '%s' "$SA_B64" | base64 -d)
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$decoded"
          {
            echo 'json<<SA_EOF'
            printf '%s\n' "$decoded"
            echo 'SA_EOF'
          } >> "$GITHUB_OUTPUT"

      # Cloud Functions are intentionally NOT deployed from the preview workflow.
      # Firebase Hosting preview channels share the same Functions deployment as
      # production (preview channels rewrite to the prod backend). Deploying
      # functions per-PR would clobber prod for every other PR and user.
      #
      # When a dedicated staging-functions project (e.g.
      # worldcup-live-scores-2026-staging) is provisioned, add a
      # `deploy-functions-staging` job here that targets that project. Until
      # then, operators must promote functions changes through the prod
      # workflow only.

      - name: Deploy to Firebase Hosting preview channel
        id: hosting_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ steps.sa.outputs.json }}
          projectId: worldcup-live-scores-2026
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d

      # The action above already posts a sticky comment with the preview URL
      # via repoToken. This step adds a second comment for visibility and to
      # surface the channel ID + expiry explicitly.
      - name: Comment preview URL on PR
        if: steps.hosting_deploy.outputs.details_url != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = `${{ steps.hosting_deploy.outputs.details_url }}`;
            const channel = `pr-${{ github.event.pull_request.number }}`;
            const body = [
              '### Preview deploy ready',
              '',
              `- Channel: \`${channel}\` (expires in 7 days)`,
              `- URL: ${url}`,
              '',
              '_Cloud Functions are not re-deployed for previews; this channel',
              'rewrites to the production Functions backend._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
